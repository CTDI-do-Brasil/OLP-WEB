<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Identificação do Pallet - A4</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', 'Helvetica', sans-serif;
    }
    body {
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      margin: 0;
    }
    .no-print {
      padding: 12px;
      text-align: center;
      background: #0f172a;
      width: 100%;
    }
    .btn-print {
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 26px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-print:hover {
      background-color: #0369a1;
    }
    .page-a4 {
      width: 297mm;
      height: 200mm;
      background: white;
      padding: 10mm 15mm;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }
    .header-logo {
      position: absolute;
      top: 10mm;
      right: 15mm;
    }
    .header-logo img {
      height: 44px;
      width: auto;
    }
    .pallet-header {
      text-align: center;
      margin-top: 2mm;
      margin-bottom: 8mm;
    }
    .pallet-title {
      font-size: 38pt;
      font-weight: 900;
      letter-spacing: 2px;
      color: #000;
      line-height: 1;
    }
    .pallet-code {
      font-size: 58pt;
      font-weight: 900;
      letter-spacing: 4px;
      color: #000;
      margin: 4px 0 6px 0;
      line-height: 1;
    }
    .barcode-container {
      text-align: center;
    }
    .barcode-container svg {
      width: 480px;
      height: 80px;
    }
    
    /* GRID CENTRALIZADO (OPÇÃO A) */
    .content-grid {
      display: flex;
      gap: 15mm;
      margin-top: 4mm;
      flex: 1;
    }
    
    /* CARTÃO ESQUERDO: DADOS DO LOTE */
    .card-lote {
      flex: 1;
      border: 2.5px solid #000;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      background: #fdfdfd;
    }
    .data-group {
      margin-bottom: 12px;
    }
    .data-group:last-child {
      margin-bottom: 0;
    }
    .data-label {
      font-size: 11pt;
      font-weight: 800;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 3px;
      letter-spacing: 1px;
    }
    .data-value-model {
      font-size: 24pt;
      font-weight: 900;
      color: #000;
      line-height: 1.1;
    }
    .data-value-region {
      font-size: 17pt;
      font-weight: 800;
      color: #000;
      line-height: 1.2;
    }
    .data-value-units {
      font-size: 26pt;
      font-weight: 900;
      color: #000;
      letter-spacing: 1px;
    }
    
    /* CARTÃO DIREITO: NÚMERO DAS CAIXAS */
    .card-caixas {
      flex: 1.4;
      border: 2.5px solid #000;
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      background: #fdfdfd;
    }
    .caixas-header {
      font-size: 18pt;
      font-weight: 900;
      color: #000;
      text-align: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #000;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .caixas-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
      max-height: 75mm;
      overflow: hidden;
    }
    .box-chip {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12.5pt;
      font-weight: 900;
      color: #000;
      background: #eee;
      border: 1.5px solid #333;
      border-radius: 4px;
      padding: 4px 8px;
      letter-spacing: 0.5px;
    }
    
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }
      body {
        background: none;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .page-a4 {
        width: 100vw;
        height: 100vh;
        box-shadow: none;
        padding: 10mm 15mm;
        page-break-after: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button class="btn-print" onclick="window.print()">
      🖨️ Imprimir Folha A4 do Pallet
    </button>
  </div>

  <div class="page-a4">
    <div class="header-logo">
      <img src="img/ctdi-logo.png" alt="CTDI" onerror="this.style.display='none'">
    </div>

    <div class="pallet-header">
      <div class="pallet-title">PALLET #</div>
      <div class="pallet-code" id="pallet-code-val">P000000001</div>
      <div class="barcode-container">
        <svg id="barcode"></svg>
      </div>
    </div>

    <!-- GRID CENTRALIZADO (OPÇÃO A) -->
    <div class="content-grid">
      <!-- CARTÃO ESQUERDO -->
      <div class="card-lote">
        <div class="data-group">
          <div class="data-label">Modelo do Equipamento:</div>
          <div class="data-value-model" id="model-val">EG8041X6-10</div>
        </div>
        <div class="data-group">
          <div class="data-label">Regional / Data e Hora:</div>
          <div class="data-value-region" id="region-val">SANTANA DE PARNAIBA/SP</div>
          <div style="font-size: 13pt; font-weight: 700; color: #333; margin-top: 2px;" id="date-val">21/08/2026 09:41:10</div>
        </div>
        <div class="data-group">
          <div class="data-label">Total de Unidades:</div>
          <div class="data-value-units" id="units-count-val">10 UNIDADES</div>
        </div>
      </div>

      <!-- CARTÃO DIREITO -->
      <div class="card-caixas">
        <div class="caixas-header">Número das Caixas (1)</div>
        <div class="caixas-grid" id="boxes-grid">
          <div class="box-chip">C000000003</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function renderBarcode(code) {
      JsBarcode("#barcode", code, {
        format: "CODE128",
        width: 3.8,
        height: 75,
        displayValue: false,
        margin: 0
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const palletCode = document.getElementById('pallet-code-val').innerText.trim();
      renderBarcode(palletCode);
    });
  </script>
</body>
</html>
