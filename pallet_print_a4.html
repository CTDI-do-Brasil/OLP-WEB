<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Identificação do Pallet - A4</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', 'Helvetica', sans-serif;
    }
    body {
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      margin: 0;
    }
    .no-print {
      padding: 12px;
      text-align: center;
      background: #0f172a;
      width: 100%;
    }
    .btn-print {
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 26px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-print:hover {
      background-color: #0369a1;
    }
    .page-a4 {
      width: 297mm;
      height: 200mm;
      background: white;
      padding: 10mm 15mm;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }
    .header-logo {
      position: absolute;
      top: 10mm;
      right: 15mm;
    }
    .header-logo img {
      height: 44px;
      width: auto;
    }
    .pallet-header {
      text-align: center;
      margin-top: 2mm;
      margin-bottom: 8mm;
    }
    .pallet-title {
      font-size: 38pt;
      font-weight: 900;
      letter-spacing: 2px;
      color: #000;
      line-height: 1;
    }
    .pallet-code {
      font-size: 58pt;
      font-weight: 900;
      letter-spacing: 4px;
      color: #000;
      margin: 4px 0 6px 0;
      line-height: 1;
    }
    .barcode-container {
      text-align: center;
    }
    .barcode-container svg {
      width: 480px;
      height: 80px;
    }
    
    /* GRID CENTRALIZADO (OPÇÃO A) */
    .content-grid {
      display: flex;
      gap: 15mm;
      margin-top: 4mm;
      flex: 1;
    }
    
    /* CARTÃO ESQUERDO: DADOS DO LOTE */
    .card-lote {
      flex: 1;
      border: 2.5px solid #000;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      background: #fdfdfd;
    }
    .data-group {
      margin-bottom: 12px;
    }
    .data-group:last-child {
      margin-bottom: 0;
    }
    .data-label {
      font-size: 11pt;
      font-weight: 800;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 3px;
      letter-spacing: 1px;
    }
    .data-value-model {
      font-size: 24pt;
      font-weight: 900;
      color: #000;
      line-height: 1.1;
    }
    .data-value-region {
      font-size: 17pt;
      font-weight: 800;
      color: #000;
      line-height: 1.2;
    }
    .data-value-units {
      font-size: 26pt;
      font-weight: 900;
      color: #000;
      letter-spacing: 1px;
    }
    
    /* CARTÃO DIREITO: NÚMERO DAS CAIXAS (40 CAIXAS EM 4 COLUNAS) */
    .card-caixas {
      flex: 1.6;
      border: 2.5px solid #000;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      background: #fdfdfd;
    }
    .caixas-header {
      font-size: 16pt;
      font-weight: 900;
      color: #000;
      text-align: center;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 2px solid #000;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .caixas-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px 5px;
      width: 100%;
    }
    .box-chip {
      font-family: 'Courier New', Courier, monospace;
      font-size: 9.5pt;
      font-weight: 900;
      color: #000;
      background: #f8fafc;
      border: 1.2px solid #000;
      border-radius: 3px;
      padding: 2.5px 2px;
      text-align: center;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }
      body {
        background: none;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .page-a4 {
        width: 100vw;
        height: 100vh;
        box-shadow: none;
        padding: 8mm 14mm;
        page-break-after: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button class="btn-print" onclick="window.print()">
      🖨️ Imprimir Folha A4 do Pallet
    </button>
  </div>

  <div class="page-a4">
    <div class="header-logo">
      <img src="img/ctdi-logo.png" alt="CTDI" onerror="this.style.display='none'">
    </div>

    <div class="pallet-header">
      <div class="pallet-title">PALLET #</div>
      <div class="pallet-code" id="pallet-code-val">P000000001</div>
      <div class="barcode-container" id="barcode-container">
        <svg id="barcode"></svg>
      </div>
    </div>

    <!-- GRID CENTRALIZADO (OPÇÃO A) -->
    <div class="content-grid">
      <!-- CARTÃO ESQUERDO -->
      <div class="card-lote">
        <div class="data-group">
          <div class="data-label">Modelo do Equipamento:</div>
          <div class="data-value-model" id="model-val">EG8041X6-10</div>
        </div>
        <div class="data-group">
          <div class="data-label">Regional / Data e Hora:</div>
          <div class="data-value-region" id="region-val">SANTANA DE PARNAIBA/SP</div>
          <div style="font-size: 12pt; font-weight: 700; color: #333; margin-top: 2px;" id="date-val">21/08/2026 09:41:10</div>
        </div>
        <div class="data-group">
          <div class="data-label">Total de Unidades:</div>
          <div class="data-value-units" id="units-count-val">10 UNIDADES</div>
        </div>
      </div>

      <!-- CARTÃO DIREITO -->
      <div class="card-caixas">
        <div class="caixas-header">Número das Caixas (1)</div>
        <div class="caixas-grid" id="boxes-grid">
          <div class="box-chip">C000000003</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function generateCode128SvgHtml(text, height = 70, scale = 3.2) {
      const patterns = [
        '11011001100','11001101100','11001100110','10010011000','10010001100','10001001100','10011001000','10011000100','10001100100','11001001000',
        '11001000100','11000100100','10110011100','10011011100','10011001110','10111001100','10011101100','10011100110','11001110010','11001011100',
        '11001001110','11011100100','11001110100','11101101110','11101001100','11100101100','11100100110','11101100100','11100110100','11100110010',
        '11011011000','11011000110','11000110110','10100011000','10001011000','10001000110','10110001000','10001101000','10001100010','11010001000',
        '11000101000','11000100010','10110111000','10110001110','10001101110','10111011000','10111000110','10001110110','11101110110','11010001110',
        '11000101110','11011101000','11011100010','11011101110','11101011000','11101000110','11100010110','11101101000','11101100010','11100011010',
        '11101111010','11001000010','11110001010','10100110000','10100001100','10010110000','10010000110','10000101100','10000100110','10110010000',
        '10110000100','10011010000','10011000010','10000110100','10000110010','11000010010','11001010000','11110111010','11000010100','10001111010',
        '10100111100','10010111100','10010011110','10111100100','10011110100','10011110010','11110100100','11110010100','11110010010','11011011110',
        '11011110110','11110110110','10101111000','10100011110','10001011110','10111101000','10111100010','11110101000','11110100010','10111011110',
        '10111101110','11101011110','11110101110','11010000100','11010010000','11010011100','1100011101011'
      ];
      const START_B = 104;
      const STOP = 106;
      const str = String(text || '').trim();
      let checksum = START_B;
      let bitString = patterns[START_B];
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 32;
        if (code >= 0 && code < patterns.length) {
          checksum += code * (i + 1);
          bitString += patterns[code];
        }
      }
      const checkCode = checksum % 103;
      bitString += patterns[checkCode];
      bitString += patterns[STOP];
      const width = bitString.length * scale;
      let svg = '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"' + width + '\" height=\"' + height + '\" viewBox=\"0 0 ' + width + ' ' + height + '\">';
      svg += '<rect width=\"100%\" height=\"100%\" fill=\"#fff\"/>';
      let posX = 0;
      for (let i = 0; i < bitString.length; i++) {
        if (bitString[i] === '1') {
          svg += '<rect x=\"' + posX + '\" y=\"0\" width=\"' + scale + '\" height=\"' + height + '\" fill=\"#000\"/>';
        }
        posX += scale;
      }
      svg += '</svg>';
      return svg;
    }

    function renderBarcode(code) {
      const container = document.getElementById('barcode-container');
      if (container) {
        container.innerHTML = generateCode128SvgHtml(code, 68, 3.2);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const palletCode = document.getElementById('pallet-code-val').innerText.trim();
      renderBarcode(palletCode);
    });
  </script>
</body>
</html>
